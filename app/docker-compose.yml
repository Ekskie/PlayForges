version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: playforge_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: playforge_admin
      MYSQL_USER: playforge_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
